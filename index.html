<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eladio Transport · Prototipo</title>
<meta name="description" content="Prototipo de demostración para coordinar viajes de Eladio en Punta Hermosa. Datos de ejemplo.">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%232b63d9'/%3E%3Cpath d='M12 38c7-6 13-6 20 0s13 6 20 0' stroke='%23fff' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='44' cy='22' r='6' fill='%23f4b740'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --font:"Figtree", "Avenir Next", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --bg:#f4f6f8; --surface:#ffffff; --surface-2:#f0f3f7; --sand:#f6eee1; --sand-ink:#6b5332; --sand-line:#eadcc4;
  --ink:#18212b; --muted:#5d6876; --line:#e2e7ed;
  --primary:#2b63d9; --primary-hover:#1f50ba; --primary-soft:#e9f0fd; --on-primary:#ffffff;
  --sun:#f4b740; --ok:#1e9e6a; --danger:#c93d3d;
  --s-pending:#8a5a00; --s-pending-bg:#fff2d3;
  --s-approved:#b0521b; --s-approved-bg:#fde8db;
  --s-assigned:#2b63d9; --s-assigned-bg:#e9f0fd;
  --s-accepted:#157a52; --s-accepted-bg:#e0f4eb;
  --s-active:#6a44c2; --s-active-bg:#efe9fb;
  --s-done:#56616d; --s-done-bg:#eceff3;
  --s-cancel:#c93d3d; --s-cancel-bg:#fbe5e5;
  --r-xl:26px; --r-lg:18px; --r:14px; --r-sm:10px;
  --shadow-sm:0 1px 2px rgba(24,33,43,.05);
  --shadow:0 1px 2px rgba(24,33,43,.04), 0 14px 34px -16px rgba(24,33,43,.22);
  --header-h:60px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141a; --surface:#171e26; --surface-2:#1e2731; --sand:#2a2419; --sand-ink:#ead5b1; --sand-line:#3d3424;
    --ink:#e9eef3; --muted:#9ba8b6; --line:#27323e;
    --primary:#6e9bff; --primary-hover:#8db0ff; --primary-soft:#1c2a44; --on-primary:#0b1220;
    --s-pending:#f5cd70; --s-pending-bg:#372a0e;
    --s-approved:#ffb48c; --s-approved-bg:#3b2416;
    --s-assigned:#9bbcff; --s-assigned-bg:#1c2a44;
    --s-accepted:#7fdcb5; --s-accepted-bg:#12352a;
    --s-active:#c9b2ff; --s-active-bg:#2b2145;
    --s-done:#b3bdc8; --s-done-bg:#232c36;
    --s-cancel:#ff9d9d; --s-cancel-bg:#3d1f22;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 34px -16px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
h1,h2,h3{line-height:1.15;margin:0 0 .4em;letter-spacing:-.015em}
h1{font-size:clamp(1.55rem,4vw,2rem);font-weight:800}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
p{margin:0 0 .8em}
a{color:var(--primary)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:0;background:var(--surface);padding:10px 14px;z-index:100}
.skip:focus{left:10px;top:10px}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
.wrap.wide{max-width:1480px}

/* Header */
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb, var(--surface) 92%, transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topbar-in{display:flex;align-items:center;gap:10px;min-height:var(--header-h)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:6px 2px;font-weight:800;font-size:1.08rem;letter-spacing:-.01em;color:var(--ink)}
.brand small{display:block;font-weight:500;font-size:.74rem;color:var(--muted);letter-spacing:0}
.brand-text{text-align:left;line-height:1.1}
.topnav{display:flex;gap:2px;margin-left:auto}
.topnav button{background:none;border:0;color:var(--muted);padding:10px 12px;min-height:44px;border-radius:999px;font-weight:600;font-size:.95rem}
.topnav button[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
.lang{display:flex;background:var(--surface-2);border-radius:999px;padding:3px}
.lang button{background:none;border:0;padding:7px 11px;min-height:38px;min-width:42px;font-weight:700;font-size:.86rem;border-radius:999px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.demo-pill{display:flex;justify-content:center;padding:8px 18px 0}
.demo-pill span{background:var(--sand);color:var(--sand-ink);border:1px solid var(--sand-line);border-radius:999px;padding:5px 14px;font-size:.84rem;font-weight:600;text-align:center}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;text-decoration:none;font-size:.96rem;line-height:1.2;transition:background .15s, border-color .15s}
.btn:hover{border-color:color-mix(in srgb, var(--primary) 45%, var(--line))}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.soft{background:var(--primary-soft);border-color:transparent;color:var(--primary)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--muted)}
.btn.quiet:hover{color:var(--ink);background:var(--surface-2)}
.btn.danger{color:var(--danger);border-color:var(--s-cancel-bg);background:var(--surface)}
.btn.wa{background:#25d366;border-color:#25d366;color:#08311a}
.btn.lg{min-height:54px;padding:14px 24px;font-size:1.04rem}
.btn.sm{min-height:38px;padding:7px 13px;font-size:.88rem}
.btn.block{width:100%}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}

/* Notes */
.note{color:var(--muted);font-size:.88rem}
.callout{border-radius:var(--r);padding:11px 14px;font-size:.92rem;display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);color:var(--ink)}
.callout .ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.78rem;font-weight:800;background:var(--ink);color:var(--surface)}
.callout.sand{background:var(--sand);color:var(--sand-ink)}
.callout.sand .ic{background:var(--sand-ink);color:var(--sand)}
.callout.blue{background:var(--primary-soft);color:var(--ink)}
.callout.blue .ic{background:var(--primary);color:var(--on-primary)}

/* Intro */
.hero{position:relative;padding:42px 0 110px;overflow:hidden}
.hero .kicker{color:var(--muted);font-size:1.02rem;font-weight:600;margin-bottom:22px}
.stops{list-style:none;margin:0 0 26px;padding:0}
.stops li{position:relative;padding-left:44px;font-weight:800;font-size:clamp(2rem,7.5vw,3.9rem);line-height:1.04;letter-spacing:-.035em;margin:0 0 .3em}
.stops li::before{content:"";position:absolute;left:6px;top:.3em;width:20px;height:20px;border-radius:50%;border:4px solid var(--primary);background:var(--bg)}
.stops li:not(:last-child)::after{content:"";position:absolute;left:15px;top:calc(.3em + 24px);height:calc(100% - 4px);border-left:3px dotted color-mix(in srgb, var(--primary) 55%, transparent)}
.stops li:last-child{color:var(--primary)}
.stops li:last-child::before{background:var(--sun);border-color:var(--sun)}
.hero .lead{font-size:1.12rem;max-width:58ch;color:var(--muted)}
.hero .callout{max-width:60ch;margin:18px 0}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0 8px}
.horizon{position:absolute;left:0;right:0;bottom:0;height:90px;pointer-events:none}
.horizon path{fill:var(--sand)}
.band{background:var(--sand)}
.section{padding:36px 18px}
.section h2{font-size:1.5rem;font-weight:800}
.steps{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:12px;counter-reset:s}
@media(min-width:720px){.steps{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.steps{grid-template-columns:repeat(3,1fr)}}
.steps li{counter-increment:s;background:var(--surface);border-radius:var(--r-lg);padding:18px 18px 16px 62px;position:relative;box-shadow:var(--shadow-sm)}
.steps li::before{content:counter(s);position:absolute;left:16px;top:16px;width:32px;height:32px;border-radius:50%;background:var(--primary-soft);color:var(--primary);font-weight:800;display:grid;place-items:center}
.steps h3{margin:3px 0 4px}
.steps p{margin:0;color:var(--muted);font-size:.95rem}
.roles{display:grid;gap:12px;margin-top:16px}
@media(min-width:760px){.roles{grid-template-columns:repeat(3,1fr)}}
.role-card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:6px;min-height:140px;transition:border-color .15s, transform .15s}
.role-card:hover{border-color:var(--primary);transform:translateY(-1px)}
.role-card strong{font-size:1.15rem}
.role-card span{color:var(--muted);font-size:.95rem}
.role-card em{font-style:normal;color:var(--primary);font-weight:700;margin-top:auto}
.two{display:grid;gap:14px}
@media(min-width:760px){.two{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow-sm);border:1px solid var(--line)}
.checks{list-style:none;margin:8px 0 0;padding:0}
.checks li{padding:8px 0 8px 32px;position:relative;border-top:1px solid var(--line);font-size:.95rem}
.checks li:first-child{border-top:0}
.checks li::before{position:absolute;left:0;top:9px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.76rem;font-weight:800}
.checks.yes li::before{content:"✓";background:var(--s-accepted-bg);color:var(--s-accepted)}
.checks.no li::before{content:"✕";background:var(--s-cancel-bg);color:var(--s-cancel)}
.fb label{display:block;font-weight:700;margin:14px 0 6px}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-weight:700;font-size:.9rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field .hint{font-weight:500;color:var(--muted);font-size:.8rem}
input[type=text],input[type=tel],input[type=date],input[type=time],input[type=number],select,textarea{
  width:100%;min-height:48px;padding:11px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);font-size:16px;transition:border-color .15s, box-shadow .15s}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.g2{display:grid;gap:12px}
@media(min-width:620px){.g2{grid-template-columns:1fr 1fr}}
.g3{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media(min-width:620px){.g3{grid-template-columns:1fr 1fr 1fr}}
.all{grid-column:1/-1}
.money{position:relative;display:block}
.money input{padding-left:42px}
.money::before{content:"S/";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--muted);pointer-events:none}
.tag{display:inline-block;font-size:.72rem;font-weight:700;border-radius:999px;padding:2px 8px}
.tag.ok{background:var(--s-accepted-bg);color:var(--s-accepted)}
.tag.check{background:var(--s-pending-bg);color:var(--s-pending)}

/* Segmented / chips / badges */
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:none;padding:8px 14px;min-height:38px;border-radius:999px;font-weight:700;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--sand-line);background:var(--sand);color:var(--sand-ink);border-radius:999px;padding:8px 14px;min-height:40px;font-weight:700;font-size:.9rem}
.chip:hover{border-color:var(--sand-ink)}
.chip[aria-pressed="true"]{background:var(--sand-ink);color:var(--sand);border-color:var(--sand-ink)}
.chip.plain{background:var(--surface);border-color:var(--line);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-pending{background:var(--s-pending-bg);color:var(--s-pending)}
.b-approved{background:var(--s-approved-bg);color:var(--s-approved)}
.b-assigned{background:var(--s-assigned-bg);color:var(--s-assigned)}
.b-accepted{background:var(--s-accepted-bg);color:var(--s-accepted)}
.b-active{background:var(--s-active-bg);color:var(--s-active)}
.b-done{background:var(--s-done-bg);color:var(--s-done)}
.b-cancel{background:var(--s-cancel-bg);color:var(--s-cancel)}
.b-paid{background:var(--s-accepted-bg);color:var(--s-accepted)}
.b-unpaid{background:var(--s-active-bg);color:var(--s-active)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--s-done)}
.dot.pending{background:var(--s-pending)} .dot.approved{background:var(--s-approved)} .dot.assigned{background:var(--s-assigned)}
.dot.accepted{background:var(--s-accepted)} .dot.active{background:var(--s-active)} .dot.cancel{background:var(--s-cancel)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.82rem;color:#fff;flex:none}
.avatar.lg{width:48px;height:48px;font-size:1rem}
.avatar.none{background:var(--surface-2);color:var(--muted);border:1.5px dashed var(--line)}

/* App shell */
.app{padding:14px 18px 40px}
.rolebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:16px}
.rolebar .lbl{font-weight:700;font-size:.9rem;color:var(--muted)}
.rolebar .lock{font-size:.82rem;color:var(--sand-ink);background:var(--sand);border-radius:999px;padding:5px 12px}
.app-foot{margin-top:26px}
.empty{color:var(--muted);text-align:center;padding:24px;border:1.5px dashed var(--line);border-radius:var(--r-lg);font-size:.95rem}

/* ---- Family (rider) ---- */
.rider{max-width:620px;margin:0 auto}
.hello{font-size:clamp(1.6rem,6vw,2.1rem);font-weight:800;letter-spacing:-.025em;margin:6px 0 2px}
.fam-pick{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.fam-pick select{width:auto;min-height:40px;padding:6px 12px;border-radius:999px;font-size:.92rem}
.next{background:var(--surface);border-radius:var(--r-xl);padding:20px;box-shadow:var(--shadow);margin-bottom:18px;border:1px solid var(--line)}
.next .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.next .when{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.next .day{color:var(--muted);font-weight:600}
.trip-line{display:grid;grid-template-columns:18px 1fr;gap:4px 12px;margin:12px 0}
.trip-line .pin{display:flex;flex-direction:column;align-items:center;padding-top:6px}
.trip-line .pin i{width:12px;height:12px;border-radius:50%;border:3px solid var(--primary);background:var(--surface)}
.trip-line .pin i.end{background:var(--primary)}
.trip-line .pin b{flex:1;border-left:2px dotted var(--line);margin:3px 0;min-height:16px}
.trip-line .stops-txt{display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.trip-line .stops-txt span{font-weight:700}
.trip-line .stops-txt small{display:block;color:var(--muted);font-weight:500;font-size:.8rem}
.driver-strip{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:var(--r);padding:12px;margin:12px 0}
.driver-strip .who{line-height:1.25}
.driver-strip .who small{display:block;color:var(--muted);font-size:.84rem}
.driver-strip .safe{display:inline-block;margin-top:6px;font-size:.78rem;font-weight:700;color:var(--s-accepted);background:var(--s-accepted-bg);border-radius:999px;padding:4px 10px;white-space:nowrap}
.waiting{display:flex;gap:12px;align-items:center;background:var(--s-pending-bg);color:var(--s-pending);border-radius:var(--r);padding:12px;font-weight:600;font-size:.94rem;margin:12px 0}
.book{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}
.book-head{padding:20px 20px 0}
.book-head h2{font-size:1.45rem;font-weight:800;letter-spacing:-.02em}
.progress{display:flex;gap:6px;margin:4px 0 0}
.progress i{flex:1;height:5px;border-radius:999px;background:var(--surface-2)}
.progress i.on{background:var(--primary)}
.step-label{font-size:.84rem;color:var(--muted);font-weight:600;margin:10px 0 0}
.book-body{padding:16px 20px 20px;display:flex;flex-direction:column;gap:16px}
.route-box{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;position:relative}
.route-box label{display:grid;grid-template-columns:22px 1fr;align-items:center;gap:8px;padding:6px 14px}
.route-box label+label{border-top:1px solid var(--line)}
.route-box label i{width:12px;height:12px;border-radius:50%;border:3px solid var(--primary);justify-self:center}
.route-box label.to i{background:var(--primary)}
.route-box input{border:0;min-height:50px;padding:10px 46px 10px 0;box-shadow:none!important;background:transparent}
.route-box .lbl{grid-column:2;font-size:.76rem;font-weight:700;color:var(--muted);margin-top:4px;margin-bottom:-12px}
.swap{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.1rem;display:grid;place-items:center}
.places h3{font-size:.86rem;color:var(--muted);margin:0 0 8px;font-weight:700}
.places .sub{display:flex;gap:8px;align-items:center;margin:0 0 6px;font-size:.84rem;font-weight:700;color:var(--muted)}
.stepper{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:4px}
.stepper button{width:42px;height:42px;border-radius:50%;border:0;background:var(--surface);font-size:1.3rem;font-weight:700;box-shadow:var(--shadow-sm)}
.stepper output{min-width:34px;text-align:center;font-weight:800;font-size:1.2rem}
.summary{display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:center;background:var(--surface-2);border-radius:var(--r-lg);padding:14px}
.summary dt{color:var(--muted);font-size:.85rem;font-weight:600}
.summary dd{margin:0;font-weight:700}
.summary .edit{background:none;border:0;color:var(--primary);font-weight:700;font-size:.86rem;min-height:36px;padding:0 4px}
.book-foot{display:flex;gap:10px;padding:0 20px 20px}
.book-foot .btn.primary{flex:1}
.mini{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.mini-trip{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:var(--r);padding:12px 14px;border:1px solid var(--line)}
.mini-trip .d{min-width:62px;text-align:center;line-height:1.1}
.mini-trip .d b{display:block;font-size:1.05rem}
.mini-trip .d small{color:var(--muted);font-size:.78rem;font-weight:600}
.mini-trip .m{flex:1;min-width:0;display:block}
.mini-trip .m .r{display:block}
.mini-trip .m small{display:block}
.mini-trip .m .r{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-trip .m small{color:var(--muted)}
.h-sec{font-size:1.05rem;margin:26px 0 6px}

/* ---- Driver ---- */
.driver{max-width:640px;margin:0 auto}
.drv-top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px}
.drv-top select{width:auto;min-height:40px;padding:6px 12px;border-radius:999px;font-size:.92rem}
.avail{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.92rem}
.avail::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--danger)}
.avail[aria-pressed="true"]::before{background:var(--ok)}
.trip{background:var(--surface);border-radius:var(--r-lg);padding:16px;border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.trip.hero{border-radius:var(--r-xl);box-shadow:var(--shadow);padding:20px}
.trip .t{font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.trip.hero .t{font-size:2.1rem}
.trip .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
dl.kv dt{color:var(--muted);font-size:.86rem}
dl.kv dd{margin:0;font-weight:600}
.list{display:grid;gap:10px}

/* ---- Manager ---- */
.mgr{display:block}
.pane{background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--line);box-shadow:var(--shadow-sm);min-width:0}
.pane-left{padding:14px}
.pane-center{padding:14px}
.pane-right{display:none}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.kpi{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;text-align:left;display:flex;align-items:center;gap:10px;min-height:58px}
.kpi b{font-size:1.45rem;font-weight:800;line-height:1;min-width:26px}
.kpi span{font-size:.8rem;color:var(--muted);line-height:1.2;font-weight:600}
.kpi[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.kpi.k-pending b{color:var(--s-pending)} .kpi.k-unassigned b{color:var(--s-approved)} .kpi.k-unpaid b{color:var(--s-active)} .kpi.k-today b{color:var(--primary)}
.att{margin-bottom:14px}
.att h2{font-size:.95rem;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.att h2 .n{background:var(--sun);color:#3b2a00;border-radius:999px;font-size:.75rem;padding:1px 8px}
.att-item{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:var(--sand);color:var(--sand-ink);border-radius:var(--r-sm);padding:9px 12px;margin-bottom:6px;font-size:.88rem;font-weight:600}
.att-item:hover{filter:brightness(.97)}
.filters{margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap}
.filters .seg{width:100%;display:grid;grid-template-columns:1fr 1fr;border-radius:16px}
.filters .seg button{padding:8px 6px;font-size:.86rem;border-radius:12px}
.rlist{display:flex;flex-direction:column;gap:6px}
.rrow{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid transparent;background:var(--surface-2);border-radius:var(--r);padding:10px 12px}
.rrow:hover{border-color:var(--line);background:var(--surface)}
.rrow[aria-current="true"]{border-color:var(--primary);background:var(--primary-soft)}
.rrow .d{line-height:1.1}
.rrow .d b{display:block;font-size:.9rem;white-space:nowrap}
.rrow .d small{color:var(--muted);font-size:.74rem;font-weight:600}
.rrow .m{min-width:0;display:block}
.rrow .m .r{display:block}
.rrow .m .r{font-weight:700;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .m .s{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .who{display:flex;align-items:center}
.rrow .avatar{width:30px;height:30px;font-size:.74rem}
.center-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.datenav{display:flex;gap:6px;align-items:center}
.datenav .btn{min-width:42px;padding:7px 12px}
.datenav h2{margin:0 6px;font-size:1.05rem;white-space:nowrap}
/* Timeline */
.tl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);-webkit-overflow-scrolling:touch}
.tl{--hw:68px;--lw:150px;min-width:calc(var(--lw) + 19 * var(--hw));position:relative}
.tl-hours{display:flex;position:sticky;top:0;background:var(--surface);z-index:2;border-bottom:1px solid var(--line)}
.tl-hours .lw{width:var(--lw);flex:none;position:sticky;left:0;background:var(--surface);z-index:3}
.tl-hours span{width:var(--hw);flex:none;font-size:.74rem;color:var(--muted);font-weight:600;padding:8px 0 6px 6px;border-left:1px solid var(--line)}
.tl-row{display:flex;border-bottom:1px solid var(--line);min-height:62px}
.tl-row:last-child{border-bottom:0}
.tl-label{width:var(--lw);flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px;position:sticky;left:0;background:var(--surface);z-index:1;border-right:1px solid var(--line)}
.tl-label .nm{font-weight:700;font-size:.86rem;line-height:1.15}
.tl-label .nm small{display:block;font-weight:600;color:var(--muted);font-size:.72rem}
.tl-track{position:relative;flex:1;background-image:repeating-linear-gradient(to right, transparent 0 calc(var(--hw) - 1px), var(--line) calc(var(--hw) - 1px) var(--hw));transition:background-color .15s}
.tl-track.over{background-color:var(--primary-soft)}
.tl-row.unassigned .tl-track{background-color:color-mix(in srgb, var(--s-approved-bg) 45%, transparent)}
.tl-row.off .tl-label .nm{opacity:.6}
.blk{position:absolute;height:40px;border-radius:10px;border:0;border-left:4px solid;padding:3px 8px;text-align:left;font-size:.76rem;line-height:1.25;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;box-shadow:var(--shadow-sm)}
.blk b{display:block;font-size:.78rem}
.blk[draggable="true"]{cursor:grab}
.blk.s-pending{background:var(--s-pending-bg);border-color:var(--s-pending);color:var(--ink)}
.blk.s-approved{background:var(--s-approved-bg);border-color:var(--s-approved);color:var(--ink)}
.blk.s-assigned{background:var(--s-assigned-bg);border-color:var(--s-assigned);color:var(--ink)}
.blk.s-accepted{background:var(--s-accepted-bg);border-color:var(--s-accepted);color:var(--ink)}
.blk.s-active{background:var(--s-active-bg);border-color:var(--s-active);color:var(--ink)}
.blk.s-done{background:var(--s-done-bg);border-color:var(--s-done);color:var(--muted)}
.blk.s-cancel{background:var(--s-cancel-bg);border-color:var(--s-cancel);color:var(--muted);text-decoration:line-through}
.blk.sel{outline:2px solid var(--primary);outline-offset:1px}
.now{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);z-index:1;pointer-events:none}
.now::before{content:"";position:absolute;top:-1px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--danger)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
/* Week */
.week{display:grid;gap:8px}
@media(min-width:900px){.week{grid-template-columns:repeat(7,minmax(0,1fr))}}
.wday{background:var(--surface-2);border-radius:var(--r);padding:10px;min-height:70px}
.wday.today{box-shadow:inset 0 0 0 2px var(--primary)}
.wday h3{display:flex;gap:6px;align-items:baseline;font-size:.86rem;color:var(--muted);margin:0 0 8px}
.wday h3 b{font-size:1.15rem;color:var(--ink)}
.wday .none{color:var(--muted);font-size:.82rem;margin:0}
.wev{display:block;width:100%;text-align:left;border:0;border-left:4px solid;border-radius:8px;padding:7px 9px;margin-bottom:6px;font-size:.8rem;line-height:1.3;background:var(--surface)}
.wev b{display:block}
.wev small{display:block;color:var(--muted)}
.wev.s-pending{border-color:var(--s-pending)} .wev.s-approved{border-color:var(--s-approved)} .wev.s-assigned{border-color:var(--s-assigned)}
.wev.s-accepted{border-color:var(--s-accepted)} .wev.s-active{border-color:var(--s-active)} .wev.s-done{border-color:var(--s-done);opacity:.75} .wev.s-cancel{border-color:var(--s-cancel);text-decoration:line-through;opacity:.7}

.dgrid{display:grid;gap:10px}

.dcard{border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:10px}
.dcard .hd{display:flex;gap:12px;align-items:center}
.dcard .hd b{display:block;font-size:1.02rem}
.dcard .hd small{color:var(--muted)}
.stat{display:flex;gap:16px;font-size:.86rem;color:var(--muted)}
.stat b{color:var(--ink)}
/* Inbox */
.inbox textarea{min-height:110px}
.draft{margin-top:14px;border:2px solid var(--primary);border-radius:var(--r-lg);padding:16px}
/* Detail */
.detail{display:flex;flex-direction:column}
.d-head{display:flex;align-items:flex-start;gap:10px;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.d-head h2{margin:0 0 4px;font-size:1.1rem}
.d-head .sub{color:var(--muted);font-size:.86rem}
.d-body{padding:16px;display:flex;flex-direction:column;gap:16px}
.d-sec{border-top:1px solid var(--line);padding-top:14px}
.d-sec h3{font-size:.95rem;margin-bottom:8px}
.icon-btn{border:0;background:var(--surface-2);width:40px;height:40px;border-radius:50%;font-size:1.25rem;line-height:1;flex:none;margin-left:auto}
pre.msg{white-space:pre-wrap;background:var(--surface-2);border-radius:var(--r);padding:12px;margin:8px 0;font-family:var(--font);font-size:.92rem}
details summary{cursor:pointer;font-weight:700;min-height:40px;display:flex;align-items:center;gap:6px}
.declined{background:var(--s-cancel-bg);color:var(--s-cancel);border-radius:var(--r-sm);padding:9px 12px;font-weight:700;font-size:.88rem}
.d-empty{padding:28px 18px;text-align:center;color:var(--muted)}
.d-empty .ill{width:64px;height:64px;margin:0 auto 10px;border-radius:50%;background:var(--sand);display:grid;place-items:center;font-size:1.6rem}

/* Bottom nav (manager on phones) */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb, var(--surface) 94%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;font-size:.74rem;font-weight:700;color:var(--muted);border-radius:12px;position:relative}
.bnav button svg{width:22px;height:22px}
.bnav button[aria-pressed="true"]{color:var(--primary);background:var(--primary-soft)}
.bnav .n{position:absolute;top:4px;right:calc(50% - 22px);background:var(--sun);color:#3b2a00;border-radius:999px;font-size:.68rem;padding:0 6px}
body.has-bnav{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.center-tabs{display:none}
@media (max-width:1099px){
  .mgr[data-m="trips"] .pane-center{display:none}
  .mgr:not([data-m="trips"]) .pane-left{display:none}
}
@media (min-width:1100px){
  .mgr{display:grid;grid-template-columns:340px minmax(0,1fr) 390px;gap:14px;align-items:start}
  .pane-left,.pane-right{position:sticky;top:calc(var(--header-h) + 12px);max-height:calc(100vh - var(--header-h) - 24px);overflow:auto}
  .pane-right{display:block}
  .bnav{display:none}
  body.has-bnav{padding-bottom:0}
  .center-tabs{display:flex;margin-bottom:12px}
  .mob-only{display:none}
}

/* Sheet dialog */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:100%;max-width:620px;max-height:92dvh;margin:auto auto 0;border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(15,20,26,.45)}
dialog .grab{width:44px;height:5px;border-radius:999px;background:var(--line);margin:8px auto 0}
@media (min-width:700px){dialog{margin:auto;border-radius:24px}}

/* Footer & toast */
.foot{padding:22px 18px 34px;color:var(--muted);font-size:.84rem}
.foot .wrap{display:flex;flex-direction:column;gap:4px}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(30px);background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:80;max-width:calc(100vw - 32px);text-align:center;font-size:.94rem}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
body.has-bnav #toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
@media (min-width:1100px){body.has-bnav #toast{bottom:22px}}
@media(max-width:700px){
  .tl{--hw:58px;--lw:96px}
  .tl-label .nm small{display:none}
  .tl-label{gap:6px;padding:6px}
  .tl-label .avatar{width:28px;height:28px;font-size:.72rem}
}
@media(max-width:520px){
  .topnav .nav-home{display:none}
  .brand small{display:none}
  .topnav button{padding:9px 10px}
}
</style>

/* ---------- Lookups & formatting ---------- */
function driverById(id){ return data.drivers.filter(function(d){return d.id===id;})[0] || null; }
function rideById(id){ return data.rides.filter(function(r){return r.id===id;})[0] || null; }
function locale(lang){ return (lang||ui.lang)==='es' ? 'es-PE' : 'en-US'; }
function fmtDate(s, lang, long){
  var o = long ? {weekday:'long', day:'numeric', month:'long'} : {weekday:'short', day:'numeric', month:'short'};
  return new Intl.DateTimeFormat(locale(lang), o).format(parseYmd(s));
}
function fmtTime(tm, lang){
  if (!tm) return '—';
  var p = tm.split(':').map(Number);
  return new Intl.DateTimeFormat(locale(lang), {hour:'numeric', minute:'2-digit'}).format(new Date(2000,0,1,p[0],p[1]||0));
}
function relDay(s){ var D = todayStr(); if (s===D) return t('rel_today'); if (s===addDays(D,1)) return t('rel_tomorrow'); if (s===addDays(D,-1)) return t('rel_yesterday'); return ''; }
function dayShort(s){ return relDay(s) || new Intl.DateTimeFormat(locale(), {weekday:'short', day:'numeric'}).format(parseYmd(s)); }
function whenLabel(r){ var rel = relDay(r.date); return (rel ? rel + ', ' : '') + fmtDate(r.date) + ', ' + fmtTime(r.time); }
function money(n){ return (n == null || n === '' || isNaN(n)) ? null : 'S/ ' + Number(n).toFixed(2); }
function short(s, n){ s = String(s||''); n = n||26; return s.length > n ? s.slice(0,n-1) + '…' : s; }
function routeShort(r, n){ return short(r.pickup, n||20) + ' → ' + short(r.dropoff, n||20); }
function sc(st){ return {pending:'pending',approved:'approved',assigned:'assigned',accepted:'accepted',arrived:'active',onboard:'active',completed:'done',cancelled:'cancel'}[st] || 'pending'; }
function badge(st, rider){ return '<span class="badge b-'+sc(rider && st==='assigned' ? 'accepted' : st)+'">'+esc(t((rider?'rs_':'st_')+st))+'</span>'; }
function sortAsc(a,b){ return (a.date+a.time).localeCompare(b.date+b.time); }

function initials(n){ return String(n).replace(/\(.*?\)/g,'').trim().split(/\s+/).map(function(w){return w[0];}).join('').slice(0,2).toUpperCase(); }

/* ---------- Toast, copy, confirm ---------- */
var toastTimer;
function toast(msg){ var el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2800); }
function copyText(text){
  function fallback(){ var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); var ok=false; try { ok = document.execCommand('copy'); } catch(e){} document.body.removeChild(ta); toast(ok ? t('copied') : t('copyFail')); }
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(function(){ toast(t('copied')); }, fallback); else fallback();
}
function ask(msg){ try { return window.confirm(msg) !== false; } catch(e){ return true; } }

/* ---------- Manager ---------- */
var OPEN = ['pending','approved','assigned','accepted','arrived','onboard'];
var MOVABLE = ['pending','approved','assigned','accepted'];
var GROUPS = { pending:['pending'], scheduled:['approved','assigned','accepted'], active:['arrived','onboard'], closed:['completed','cancelled'] };
function inGroup(r, g){
  if (g==='unpaid') return r.status==='completed' && !r.paid;
  if (g==='today') return r.date===todayStr() && r.status!=='cancelled';
  if (g==='unassigned') return r.status==='approved';
  return GROUPS[g].indexOf(r.status) > -1;
}
function kpis(){
  var c = function(g){ return data.rides.filter(function(r){ return inGroup(r,g); }).length; };
  return {pending:c('pending'), today:c('today'), unassigned:c('unassigned'), unpaid:c('unpaid')};
}
function manager(){
  var r = ui.sel ? rideById(ui.sel) : null;
  return '<h1 class="sr">Eladio</h1><div class="mgr" data-m="'+ui.m+'">' +
    '<aside class="pane pane-left" aria-label="'+esc(t('mTrips'))+'">'+leftPane()+'</aside>' +
    '<section class="pane pane-center" aria-label="'+esc(t('mAgenda'))+'">'+centerPane()+'</section>' +
    '<aside class="pane pane-right" aria-live="polite">'+(r && isWide() ? detailHtml(r, false) : detailEmpty())+'</aside>' +
  '</div>';
}
function bnav(){
  var k = kpis();

}
function leftPane(){

  var fl = [['pending','fPending'],['scheduled','fScheduled'],['active','fActive'],['closed','fClosed']].map(function(x){
    return '<button data-action="filter" data-arg="'+x[0]+'" aria-pressed="'+(ui.filter===x[0])+'">'+esc(t(x[1]))+'</button>';

  return '<div class="kpis">'+kp+'</div>' + att +

function rowHtml(r){

  return '<button class="rrow" data-action="open-ride" data-arg="'+r.id+'" aria-current="'+(ui.sel===r.id)+'">' +
    '<span class="d"><b>'+esc(fmtTime(r.time))+'</b><small>'+esc(dayShort(r.date))+'</small></span>' +
    '<span class="m"><span class="r">'+esc(routeShort(r,18))+'</span><span class="s"><i class="dot '+sc(r.status)+'"></i>'+esc(t('st_'+r.status))+' · '+esc(r.customer)+'</span></span>' +
    '<span class="who" title="'+esc(d ? d.name : t('unassigned'))+'">'+avatar(d)+'</span></button>';
}
function attentionItems(){
  var D = todayStr(), soon = addDays(D,2), items = [];
  data.rides.slice().sort(sortAsc).forEach(function(r){
    var v = {route:dayShort(r.date)+' '+fmtTime(r.time)+', '+short(r.dropoff,18)};
    if (r.status==='approved' && r.declinedBy){ v.name = r.declinedBy.replace(/\s*\(.*\)/,''); items.push([0, t('attDeclined',v), r.id]); }
    else if (r.status==='pending') items.push([1, t('attPending',v), r.id]);
    else if (r.status==='approved' && r.date <= soon) items.push([2, t('attNoDriver',v), r.id]);
    else if (r.status==='assigned' && r.date <= addDays(D,1) && !(driverById(r.driverId)||{}).owner){ var d = driverById(r.driverId); v.name = d ? d.name.replace(/\s*\(.*\)/,'') : ''; items.push([3, t('attNotAccepted',v), r.id]); }
    else if (r.status==='completed' && !r.paid) items.push([4, t('attUnpaid',v), r.id]);
  });
  return items.sort(function(a,b){return a[0]-b[0];}).slice(0,4);
}

/* Agenda: day timeline + week */
var H0 = 5, H1 = 24;
function agenda(){
  var D = todayStr();
  var label = ui.calMode==='week'
    ? new Intl.DateTimeFormat(locale(), {day:'numeric', month:'short'}).format(parseYmd(startOfWeek(ui.calDate))) + ' – ' + new Intl.DateTimeFormat(locale(), {day:'numeric', month:'short'}).format(parseYmd(addDays(startOfWeek(ui.calDate),6)))
    : (relDay(ui.calDate) ? relDay(ui.calDate)+', ' : '') + fmtDate(ui.calDate);
  var head = '<div class="center-head"><div class="seg" role="group">' +
      '<button data-action="cal-mode" data-arg="day" aria-pressed="'+(ui.calMode==='day')+'">'+esc(t('calDay'))+'</button>' +
      '<button data-action="cal-mode" data-arg="week" aria-pressed="'+(ui.calMode==='week')+'">'+esc(t('calWeek'))+'</button></div>' +
    '<div class="datenav"><button class="btn sm" data-action="cal-move" data-arg="-1" aria-label="'+esc(t('calPrev'))+'">‹</button>' +
      '<h2 aria-live="polite">'+esc(label)+'</h2>' +
      '<button class="btn sm" data-action="cal-move" data-arg="1" aria-label="'+esc(t('calNext'))+'">›</button>' +
      (ui.calDate!==D ? '<button class="btn sm soft" data-action="cal-today">'+esc(t('calToday'))+'</button>' : '') + '</div></div>';
  return head + (ui.calMode==='week' ? week() : timeline()) +
    '<div class="legend">'+['pending','approved','assigned','accepted','onboard','completed'].map(function(s){ return badge(s); }).join('')+'</div>' +
    '<p class="note" style="margin-top:10px">'+esc(t(ui.calMode==='week'?'calWarn':'tlNote'))+'</p>';
}
function lanes(rides){
  var ends = [];
  return rides.map(function(r){
    var p = r.time.split(':').map(Number), s = p[0] + p[1]/60;
    var lane = 0; while (ends[lane] != null && ends[lane] > s + 0.001) lane++;
    ends[lane] = s + 1;
    return {r:r, start:s, lane:lane};
  });
}
function timeline(){
  var day = ui.calDate;
  var rides = data.rides.filter(function(r){ return r.date===day; }).sort(sortAsc);
  var hours = ''; for (var h=H0; h<H1; h++){ hours += '<span>'+esc(fmtTime(pad(h)+':00').replace(':00',''))+'</span>'; }
  var rows = [{id:'none', name:t('noDriverRow')}].concat(data.drivers);
  var nowLine = '';
  if (day === todayStr()){ var n = new Date(), hh = n.getHours() + n.getMinutes()/60; if (hh>=H0 && hh<H1) nowLine = '<i class="now" style="left:calc('+(hh-H0)+' * var(--hw))"></i>'; }
  var body = rows.map(function(d){
    var mine = rides.filter(function(r){ return d.id==='none' ? (!r.driverId && r.status!=='cancelled') : r.driverId===d.id; });
    var L = lanes(mine), nl = L.reduce(function(m,x){ return Math.max(m, x.lane+1); }, 1);
    var blocks = L.map(function(x){
      var r = x.r, left = Math.max(0, x.start - H0), mov = MOVABLE.indexOf(r.status) > -1;
      return '<button class="blk s-'+sc(r.status)+(ui.sel===r.id?' sel':'')+'" style="left:calc('+left+' * var(--hw) + 2px);width:calc(var(--hw) * 1.6 - 4px);top:'+(8+x.lane*46)+'px" data-action="open-ride" data-arg="'+r.id+'" data-ride="'+r.id+'"'+(mov?' draggable="true"':'')+' aria-label="'+esc(fmtTime(r.time)+', '+r.pickup+' → '+r.dropoff+', '+t('st_'+r.status))+'">' +
        '<b>'+esc(fmtTime(r.time))+'</b>'+esc(short(r.dropoff,22))+'</button>';
    }).join('');
    var label = d.id==='none'
      ? '<span class="avatar none" aria-hidden="true">?</span><span class="nm">'+esc(d.name)+'</span>'
      : avatar(d) + '<span class="nm">'+esc(d.name.replace(/\s*\(.*\)/,''))+'<small>'+esc(t(d.available?'available':'unavailable'))+'</small></span>';
    return '<div class="tl-row'+(d.id==='none'?' unassigned':'')+(d.available===false?' off':'')+'"><div class="tl-label">'+label+'</div>' +
      '<div class="tl-track" data-drop="'+d.id+'" style="min-height:'+(16+nl*46)+'px">'+blocks+nowLine+'</div></div>';
  }).join('');
  return '<div class="tl-wrap" data-day="'+day+'"><div class="tl"><div class="tl-hours"><span class="lw"></span>'+hours+'</div>'+body+'</div></div>';
}
function week(){
  var D = todayStr(), ws = startOfWeek(ui.calDate);
  return '<div class="week">' + [0,1,2,3,4,5,6].map(function(i){
    var day = addDays(ws,i), dd = parseYmd(day);
    var rides = data.rides.filter(function(r){ return r.date===day; }).sort(sortAsc);
    return '<section class="wday'+(day===D?' today':'')+'" aria-label="'+esc(fmtDate(day,null,true))+'"><h3><b>'+dd.getDate()+'</b>'+esc(new Intl.DateTimeFormat(locale(),{weekday:'short'}).format(dd))+'</h3>' +
      (rides.length ? rides.map(function(r){ var d = driverById(r.driverId);
        return '<button class="wev s-'+sc(r.status)+'" data-action="open-ride" data-arg="'+r.id+'"><b>'+esc(fmtTime(r.time))+'</b>'+esc(short(r.dropoff,24))+'<small>'+esc(d ? d.name.replace(/\s*\(.*\)/,'') : t('st_'+r.status))+'</small></button>';
      }).join('') : '<p class="none">'+esc(t('calNone'))+'</p>') + '</section>';
  }).join('') + '</div>';
}

/* Drivers pane */

function parseMessage(raw){
  var out = {raw:raw, customer:'', pickup:'', dropoff:'', date:'', time:'', pax:'', found:{}};
  var n = norm(raw).replace(/a\.\s?m\.?/g,'am').replace(/p\.\s?m\.?/g,'pm');
  var D = todayStr();
  // Customer: "Familia X"
  var fm = raw.match(/\bfamilia\s+([A-ZÁÉÍÓÚÑ][\wáéíóúñ]+)/i);
  if (fm){ out.customer = 'Familia ' + fm[1].charAt(0).toUpperCase() + fm[1].slice(1); out.found.customer = true; }
  // Date
  var nd = n.replace(/\b(de|en|por) la manana\b/g,' ').replace(/\b(in the|this) morning\b/g,' ');
  var date = '';
  if (/\bpasado manana\b|\bday after tomorrow\b/.test(nd)) date = addDays(D,2);
  else if (/\bmanana\b|\btomorrow\b/.test(nd)) date = addDays(D,1);
  else if (/\bhoy\b|\btoday\b|\btonight\b|\besta noche\b/.test(nd)) date = D;
  else {
    var days = [['domingo','sunday'],['lunes','monday'],['martes','tuesday'],['miercoles','wednesday'],['jueves','thursday'],['viernes','friday'],['sabado','saturday']];
    for (var i=0;i<7 && !date;i++){
      if (days[i].some(function(w){ return new RegExp('\\b'+w+'\\b').test(nd); })){
        var diff = (i - parseYmd(D).getDay() + 7) % 7; date = addDays(D, diff);
      }
    }
    if (!date){
      var dm = nd.match(/\b(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?\b/);
      if (dm){
        var dday = +dm[1], mon = +dm[2], yr = dm[3] ? +dm[3] : new Date().getFullYear(); if (yr < 100) yr += 2000;
        if (dday>=1 && dday<=31 && mon>=1 && mon<=12){
          var cand = ymd(new Date(yr, mon-1, dday));
          if (!dm[3] && cand < D) cand = ymd(new Date(yr+1, mon-1, dday));
          date = cand;
        }
      }
    }
  }
  if (date){ out.date = date; out.found.date = true; }
  // Time
  var h = null, mi = 0, mer = null, m;
  if ((m = n.match(/(?:a las|a la|at|@)\s*(\d{1,2})(?:[:.h](\d{2}))?\s*(am|pm)?/))){ h=+m[1]; mi=m[2]?+m[2]:0; mer=m[3]||null; }
  else if ((m = n.match(/\b(\d{1,2}):(\d{2})\s*(am|pm)?/))){ h=+m[1]; mi=+m[2]; mer=m[3]||null; }
  else if ((m = n.match(/\b(\d{1,2})\s*(am|pm)\b/))){ h=+m[1]; mer=m[2]; }
  if (h !== null && h < 24 && mi < 60){
    if (!mer){
      if (/de la tarde|de la noche|in the afternoon|in the evening|at night|tonight|esta noche/.test(n)) mer = 'pm';
      else if (/de la manana|in the morning|de madrugada/.test(n)) mer = 'am';
    }
    var clear = !!mer || h > 12 || h === 0;
    if (mer==='pm' && h<12) h += 12;
    if (mer==='am' && h===12) h = 0;
    out.time = pad(h)+':'+pad(mi); out.found.time = clear;
  }
  // Passengers
  var W = {un:1,una:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8};
  var nums = '(\\d{1,2}|un|una|uno|dos|tres|cuatro|cinco|seis|siete|ocho|one|two|three|four|five|six|seven|eight)';
  var pm = n.match(new RegExp('\\b'+nums+'\\s+(personas?|pasajeros?|pax|passengers?|people|persons?|adultos?|adults?)\\b')) ||
           n.match(new RegExp('\\b(?:somos|seremos|we are|we re)\\s+'+nums+'\\b'));
  if (pm){ var v = W[pm[1]] || +pm[1]; if (v>0){ out.pax = v; out.found.pax = true; } }
  // Route
  var stop = '(?=\\s*(?:[,.;!?¿\\n]|$)|\\s+(?:el|la|los|hoy|ma[ñn]ana|pasado|a las|a la|at|on|tomorrow|today|tonight|para|por favor|please|for|somos|we|y|and|con|with|lunes|martes|mi[eé]rcoles|jueves|viernes|s[áa]bado|domingo|monday|tuesday|wednesday|thursday|friday|saturday|sunday)\\b)';
  var rm = raw.match(new RegExp('\\b(?:desde|de|from)\\s+([^,.;!?¿\\n]+?)\\s+(?:hasta|hacia|al|a|to)\\s+([^,.;!?¿\\n]+?)'+stop, 'i'));
  if (rm){ out.pickup = rm[1].trim(); out.dropoff = rm[2].trim(); out.found.pickup = out.found.dropoff = true; }
  else {
    var dm2 = raw.match(new RegExp('\\b(?:al|hacia|hasta|to the)\\s+([^,.;!?¿\\n]+?)'+stop, 'i'));
    if (dm2){ out.dropoff = dm2[1].trim(); out.found.dropoff = true; }
  }
  if (out.dropoff && /^(aeropuerto|airport)$/i.test(out.dropoff)) out.dropoff = out.dropoff.charAt(0).toUpperCase() + out.dropoff.slice(1);
  out.pickup = out.pickup.slice(0,80); out.dropoff = out.dropoff.slice(0,80);
  return out;
}

function nextCard(r){

  return '<article class="next"><div class="top"><div><div class="when">'+esc(fmtTime(r.time))+'</div><div class="day">'+esc((relDay(r.date)?relDay(r.date)+', ':'')+fmtDate(r.date,null,true))+'</div></div>'+badge(r.status,true)+'</div>' +
    tripLine(r) +
    (confirmed ? '<div class="driver-strip">'+avatar(d,'lg')+'<div class="who"><b>'+esc(d.name)+'</b><small>'+esc(d.vehicle[ui.lang])+'</small><span class="safe">'+esc(t('trusted'))+'</span></div></div>'
      : '<div class="waiting"><span aria-hidden="true">⏳</span><span>'+esc(t('waitingEladio'))+'</span></div>') +
    '<div class="row">' + (r.status!=='pending' && r.fare!=null ? '<span><span class="note">'+esc(t('fare'))+'</span> <b>'+esc(money(r.fare))+'</b></span>' : '') + '<span class="spacer"></span>' +
      '<a class="btn wa sm" href="'+esc(riderWa(r))+'" target="_blank" rel="noopener">'+esc(t('writeEladio'))+'</a></div></article>';
}
function miniTrip(r){
  var dd = parseYmd(r.date);
  return '<a class="mini-trip" href="'+esc(riderWa(r))+'" target="_blank" rel="noopener" style="text-decoration:none;color:inherit" aria-label="'+esc(whenLabel(r)+', '+r.pickup+' → '+r.dropoff+'. '+t('writeEladio'))+'">' +
    '<span class="d"><b>'+dd.getDate()+'</b><small>'+esc(new Intl.DateTimeFormat(locale(),{month:'short'}).format(dd))+'</small></span>' +
    '<span class="m"><span class="r">'+esc(routeShort(r,16))+'</span><small>'+esc(fmtTime(r.time))+(r.status!=='pending'&&r.fare!=null?' · '+esc(money(r.fare)):'')+'</small></span>' + badge(r.status,true) + '</a>';
}
function bookCard(fam){
  var b = ui.book, s = b.step, D = todayStr();
  var prog = [1,2,3,4].map(function(n){ return '<i class="'+(n<=s?'on':'')+'"></i>'; }).join('');
  var body = '';
  if (s===1){
    var chips = function(which){ return fam.places.map(function(p,i){ return '<button type="button" class="chip" data-action="place" data-arg="'+which+':'+i+'" aria-pressed="'+(b[which]===p.a)+'">'+esc(p.l)+'</button>'; }).join(''); };
    body = '<div class="route-box">' +
        '<label class="from"><i></i><span class="lbl">'+esc(t('from'))+'</span><span></span><input type="text" data-book="pickup" value="'+esc(b.pickup)+'" placeholder="'+esc(t('fromPh'))+'" autocomplete="off"></label>' +
        '<label class="to"><i></i><span class="lbl">'+esc(t('to'))+'</span><span></span><input type="text" data-book="dropoff" value="'+esc(b.dropoff)+'" placeholder="'+esc(t('toPh'))+'" autocomplete="off"></label>' +
        '<button type="button" class="swap" data-action="swap" aria-label="'+esc(t('swap'))+'">⇅</button></div>' +
      '<div class="places"><h3>'+esc(t('savedPlaces'))+'</h3>' +
        '<p class="sub">'+esc(t('setFrom'))+'</p><div class="chips">'+chips('pickup')+'</div>' +
        '<p class="sub" style="margin-top:10px">'+esc(t('setTo'))+'</p><div class="chips">'+chips('dropoff')+'</div>' +
        '<p class="note" style="margin:10px 0 0">'+esc(t('savedNote'))+'</p></div>';
  } else if (s===2){
    var q = [['dToday',D],['dTomorrow',addDays(D,1)],['dAfter',addDays(D,2)]].map(function(x){ return '<button type="button" class="chip" data-action="bdate" data-arg="'+x[1]+'" aria-pressed="'+(b.date===x[1])+'">'+esc(t(x[0]))+'</button>'; }).join('');
    body = '<div class="chips">'+q+'</div>' +
      '<div class="g2"><label class="field"><span>'+esc(t('pickDate'))+'</span><input type="date" data-book="date" min="'+D+'" value="'+esc(b.date)+'"></label>' +
      '<label class="field"><span>'+esc(t('pickTime'))+'</span><input type="time" data-book="time" value="'+esc(b.time)+'"></label></div>';
  } else if (s===3){
    body = '<label class="field"><span>'+esc(t('whoRides'))+'</span><input type="text" data-book="passenger" value="'+esc(b.passenger)+'"></label>' +
      '<div class="field"><span id="pax-l">'+esc(t('paxCount'))+'</span><div class="stepper" role="group" aria-labelledby="pax-l"><button type="button" data-action="pax" data-arg="-1" aria-label="'+esc(t('less'))+'">−</button><output aria-live="polite">'+b.pax+'</output><button type="button" data-action="pax" data-arg="1" aria-label="'+esc(t('more'))+'">+</button></div></div>' +
      '<label class="field"><span>'+esc(t('fNotes'))+' <span class="hint">('+esc(t('optional'))+')</span></span><textarea data-book="notes" rows="2">'+esc(b.notes)+'</textarea></label>' +
      '<label class="field"><span>'+esc(t('fContact'))+' <span class="hint">('+esc(t('optional'))+', '+esc(t('contactHint'))+')</span></span><input type="tel" data-book="contact" value="'+esc(b.contact)+'" autocomplete="off"></label>';
  } else {
    var rowS = function(lbl, v, st){ return '<dt>'+esc(t(lbl))+'</dt><dd>'+esc(v)+'</dd><button type="button" class="edit" data-action="bstep" data-arg="'+st+'">'+esc(t('edit'))+'</button>'; };
    body = '<dl class="summary">' + rowS('fPickup', b.pickup, 1) + rowS('fDropoff', b.dropoff, 1) +
      rowS('fDate', (relDay(b.date)?relDay(b.date)+', ':'')+fmtDate(b.date), 2) + rowS('fTime', fmtTime(b.time), 2) +
      rowS('passenger', (b.passenger||fam.name)+', '+t('paxLong',{n:b.pax}), 3) + (b.notes ? rowS('fNotes', b.notes, 3) : '') + '</dl>' +
      '<div class="callout blue"><span class="ic" aria-hidden="true">i</span><span>'+esc(t('notConfirmed'))+'</span></div>';
  }
  return '<section class="book" aria-labelledby="book-h"><div class="book-head"><h2 id="book-h">'+esc(t('bookTitle'))+'</h2>' +
      '<div class="progress" aria-hidden="true">'+prog+'</div><p class="step-label">'+esc(t('stepOf',{n:s}))+': '+esc(t('s'+s))+'</p></div>' +
    '<div class="book-body">'+body+'</div>' +
    '<div class="book-foot">' + (s>1 ? '<button type="button" class="btn" data-action="bstep" data-arg="'+(s-1)+'">'+esc(t('back'))+'</button>' : '') +
      (s<4 ? '<button type="button" class="btn primary lg" data-action="bnext">'+esc(t('next'))+'</button>' : '<button type="button" class="btn primary lg" data-action="bsend">'+esc(t('send'))+'</button>') +
    '</div></section>';
}

/* ---------- Actions ---------- */
function goApp(role){ ui.view='app'; if (role) ui.role=role; try { history.replaceState(null,'','#prototipo'); } catch(e){} render(); window.scrollTo(0,0); var m = document.getElementById('main'); if (m) m.focus({preventScroll:true}); }
function focusIn(sel){ var el = document.querySelector(sel); if (el){ try { el.focus({preventScroll:true}); } catch(e){ el.focus(); } } }
function assign(r, driverId){
  if (MOVABLE.indexOf(r.status) === -1){ toast(t('dropBlocked')); return false; }
  if (driverId){ r.driverId = driverId; r.status = 'assigned'; r.declinedBy = null; toast(t('dropAssigned',{name:driverById(driverId).name})); }
  else { r.driverId = null; if (r.status !== 'pending') r.status = 'approved'; toast(t('dropUnassigned')); }
  save(); return true;
}
var actions = {
  'go-intro': function(){ ui.view='intro'; try { history.replaceState(null,'',location.pathname+location.search); } catch(e){} closeSheet(); render(); window.scrollTo(0,0); },
  'go-app': function(el){ goApp(el.dataset.arg); },
  'go-how': function(){ var s = document.getElementById('como-funciona'); if (s){ s.scrollIntoView({behavior:'smooth'}); s.focus({preventScroll:true}); } },
  'lang': function(el){ ui.lang = el.dataset.arg; lsSet(LANG_KEY, ui.lang); if (sheet.open) sheet.innerHTML = detailHtml(rideById(ui.sel), true); render(); },
  'role': function(el){ ui.role = el.dataset.arg; closeSheet(); render(); },
  'm': function(el){ ui.m = el.dataset.arg; render(); if (!isWide()) window.scrollTo(0,0); },
  'filter': function(el){ ui.filter = el.dataset.arg; ui.m = 'trips'; render(); },
  'cal-mode': function(el){ ui.calMode = el.dataset.arg; render(); },
  'cal-move': function(el){ ui.calDate = addDays(ui.calDate, (+el.dataset.arg) * (ui.calMode==='week'?7:1)); render(); },
  'cal-today': function(){ ui.calDate = todayStr(); render(); },
  'open-ride': function(el){ openRide(el.dataset.arg); },
  'close-detail': function(){ if (sheet.open) closeSheet(); else { ui.sel = null; render(); } },
  'toggle-avail': function(el){ var d = driverById(el.dataset.arg); d.available = !d.available; save(); render(); toast(ui.role==='manager' ? t(d.available?'availOnM':'availOffM',{name:d.name}) : t(d.available?'availOn':'availOff')); },
  'see-driver': function(el){ ui.driverId = el.dataset.arg; ui.role='driver'; render(); window.scrollTo(0,0); },
  'sample': function(el){ ui.inboxText = SAMPLES[+el.dataset.arg]; ui.draft = null; render(); focusIn('#inbox-text'); },
  'parse': function(){
    var ta = document.getElementById('inbox-text'); ui.inboxText = ta ? ta.value : ui.inboxText;
    if (!ui.inboxText.trim()){ toast(t('needText')); return; }
    ui.draft = parseMessage(ui.inboxText); render();
    var f = document.querySelector('.draft'); if (f){ f.scrollIntoView({block:'start'}); var i = f.querySelector('input'); if (i) i.focus({preventScroll:true}); }
  },
  'discard': function(){ ui.draft = null; render(); toast(t('discarded')); },
  'toggle-paid': function(el){ var r = rideById(el.dataset.arg); r.paid = !r.paid; save(); var sc0 = detailScope(); if (sc0){ var p = sc0.querySelector('[data-part="pay"]'); if (p) p.innerHTML = payBlock(r); } if (!sheet.open) { var keepSel = ui.sel; render(); ui.sel = keepSel; } else render(); toast(t(r.paid?'paidDone':'unpaidDone')); var s2 = detailScope(); if (s2){ var b = s2.querySelector('[data-action="toggle-paid"]'); if (b) b.focus(); } },
  'msg-lang': function(el){ ui.msgLang = el.dataset.arg; var sc1 = detailScope(), r = rideById(ui.sel); if (sc1 && r){ var p = sc1.querySelector('[data-part="msg"]'); p.innerHTML = msgBlock(r); var b = p.querySelector('[data-arg="'+ui.msgLang+'"]'); if (b) b.focus(); } },
  'copy-msg': function(){ var sc2 = detailScope(); var p = sc2 && sc2.querySelector('[data-part="wa-text"]'); if (p) copyText(p.textContent); },
  'cancel-ride': function(el){ if (!ask(t('cancelConfirm'))) return; var r = rideById(el.dataset.arg); r.status='cancelled'; save(); refreshDetail(); toast(t('cancelled')); },
  'drv': function(el){
    var p = el.dataset.arg.split(':'), act = p[0], r = rideById(p[1]); if (!r) return;
    if (act==='accept'){ r.status='accepted'; toast(t('tAccepted')); }
    else if (act==='decline'){ if (!ask(t('declineConfirm'))) return; var d = driverById(r.driverId); r.declinedBy = d ? d.name : ''; r.driverId=null; r.status='approved'; toast(t('tDeclined')); }
    else if (act==='arrived'){ r.status='arrived'; toast(t('tArrived')); }
    else if (act==='onboard'){ r.status='onboard'; toast(t('tOnboard')); }
    else if (act==='complete'){ r.status='completed'; toast(t('tCompleted')); }
    save(); render();
  },
  'fb-copy': function(){ copyText(fbText()); },
  'reset': function(){
    if (!ask(t('resetConfirm'))) return;
    lsDel(STORE_KEY); data = seed(); ui.draft=null; ui.inboxText=''; ui.calDate=todayStr(); ui.filter='pending'; ui.sel=null; ui.book=freshBook();
    closeSheet(); ui.fresh = true; render(); toast(t('resetDone'));
  },
  /* family booking */
  'place': function(el){ var p = el.dataset.arg.split(':'), fam = famNow(); ui.book[p[0]] = fam.places[+p[1]].a; render(); focusIn('[data-action="place"][data-arg="'+el.dataset.arg+'"]'); },
  'swap': function(){ var b = ui.book, x = b.pickup; b.pickup = b.dropoff; b.dropoff = x; render(); focusIn('[data-action="swap"]'); },
  'bdate': function(el){ ui.book.date = el.dataset.arg; render(); focusIn('[data-action="bdate"][data-arg="'+el.dataset.arg+'"]'); },
  'pax': function(el){ ui.book.pax = Math.max(1, Math.min(12, ui.book.pax + (+el.dataset.arg))); render(); focusIn('[data-action="pax"][data-arg="'+el.dataset.arg+'"]'); },
  'bstep': function(el){ ui.book.step = +el.dataset.arg; render(); focusBook(); },
  'bnext': function(){
    var b = ui.book;
    if (b.step===1 && (!b.pickup.trim() || !b.dropoff.trim())){ toast(t('needRoute')); focusIn(!b.pickup.trim() ? '[data-book="pickup"]' : '[data-book="dropoff"]'); return; }
    if (b.step===2 && (!b.date || !b.time)){ toast(t('needWhen')); focusIn(!b.date ? '[data-book="date"]' : '[data-book="time"]'); return; }
    b.step++; render(); focusBook();
  },
  'bsend': function(){
    var b = ui.book, fam = famNow();
    if (!b.pickup.trim() || !b.dropoff.trim() || !b.date || !b.time){ toast(t('required')); return; }
    data.rides.push({ id:uid(), date:b.date, time:b.time, familyId:fam.id, customer:fam.name, passenger:b.passenger.trim(),
      pickup:b.pickup.trim(), dropoff:b.dropoff.trim(), pax:b.pax, notes:b.notes.trim(), contact:b.contact.trim(),
      fare:null, paid:false, driverId:null, status:'pending', source:'form', declinedBy:null, sourceMessage:'' });
    save(); ui.book = freshBook(); render(); window.scrollTo(0,0); toast(t('sentToast'));
  }
};
function focusBook(){ var h = document.getElementById('book-h'); if (h){ var box = h.closest('.book'); if (box && box.getBoundingClientRect().top < 60) box.scrollIntoView({block:'start'}); var f = box.querySelector('.book-body input, .book-body button'); if (f){ try { f.focus({preventScroll:true}); } catch(e){} } } }
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-action]'); if (!el) return;
  var fn = actions[el.dataset.action]; if (fn){ e.preventDefault(); fn(el, e); }
});

/* Drag a timeline block onto another driver's row (desktop) */
var dragId = null;
document.addEventListener('dragstart', function(e){ var b = e.target.closest && e.target.closest('[data-ride][draggable="true"]'); if (!b) return; dragId = b.dataset.ride; try { e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'move'; } catch(x){} });
document.addEventListener('dragover', function(e){ var tr = e.target.closest && e.target.closest('[data-drop]'); if (!tr || !dragId) return; e.preventDefault(); tr.classList.add('over'); });
document.addEventListener('dragleave', function(e){ var tr = e.target.closest && e.target.closest('[data-drop]'); if (tr && !tr.contains(e.relatedTarget)) tr.classList.remove('over'); });
document.addEventListener('drop', function(e){
  var tr = e.target.closest && e.target.closest('[data-drop]'); if (!tr || !dragId) return; e.preventDefault();
  var r = rideById(dragId), to = tr.dataset.drop === 'none' ? null : tr.dataset.drop; dragId = null;
  if (r && (r.driverId || null) !== to){ if (assign(r, to)){ ui.fresh = true; render(); } } else render();
});
document.addEventListener('dragend', function(){ dragId = null; Array.prototype.forEach.call(document.querySelectorAll('.tl-track.over'), function(x){ x.classList.remove('over'); }); });

/* ---------- Forms ---------- */
function val(f, n){ var el = f.elements[n]; return el ? String(el.value).trim() : ''; }
function paxVal(f){ var n = parseInt(val(f,'pax'),10); return n > 0 ? Math.min(n,12) : 1; }
var forms = {
  ride: function(f){
    var r = rideById(f.dataset.id); if (!r) return;
    if (!val(f,'pickup') || !val(f,'dropoff') || !val(f,'date') || !val(f,'time')){ toast(t('required')); return; }
    var wasPending = r.status==='pending', prev = r.driverId, nd = val(f,'driver') || null;
    r.customer = val(f,'customer') || r.customer; r.passenger = val(f,'passenger'); r.pickup = val(f,'pickup'); r.dropoff = val(f,'dropoff');
    r.date = val(f,'date'); r.time = val(f,'time'); r.pax = paxVal(f); r.notes = val(f,'notes');
    var fare = val(f,'fare'); r.fare = fare==='' || isNaN(+fare) ? null : Math.max(0, +fare);
    var msg = t('saved');
    if (['completed','cancelled','arrived','onboard'].indexOf(r.status) === -1){
      if (nd !== prev || wasPending){
        r.driverId = nd;
        if (nd){ r.status='assigned'; r.declinedBy=null; msg = t('assignedTo',{name:driverById(nd).name}); }
        else { r.status='approved'; msg = wasPending ? t('approved') : t('saved'); }
      }
    } else if (nd !== prev) r.driverId = nd;
    save(); refreshDetail(); toast(msg);
  },
  draft: function(f){
    if (!val(f,'pickup') || !val(f,'dropoff') || !val(f,'date') || !val(f,'time')){ toast(t('required')); return; }
    var cust = val(f,'customer') || 'WhatsApp';
    var fam = data.families.filter(function(x){ return norm(x.name)===norm(cust); })[0];
    data.rides.push({ id:uid(), date:val(f,'date'), time:val(f,'time'), familyId: fam ? fam.id : null, customer:cust, passenger:val(f,'passenger'),
      pickup:val(f,'pickup'), dropoff:val(f,'dropoff'), pax:paxVal(f), notes:val(f,'notes'), contact:'', fare:null, paid:false, driverId:null,
      status:'pending', source:'wa', declinedBy:null, sourceMessage: ui.draft ? ui.draft.raw : '' });
    save(); ui.draft=null; ui.inboxText=''; ui.m='trips'; ui.filter='pending'; render(); window.scrollTo(0,0); toast(t('draftSaved'));
  }
};
document.addEventListener('submit', function(e){ var f = e.target; if (f.dataset && f.dataset.form && forms[f.dataset.form]){ e.preventDefault(); forms[f.dataset.form](f); } });
document.addEventListener('input', function(e){
  var el = e.target;
  if (el.id === 'inbox-text') ui.inboxText = el.value;
  if (el.dataset && el.dataset.book) ui.book[el.dataset.book] = el.value;
  if (el.dataset && el.dataset.fb != null){ ui.fb[+el.dataset.fb] = el.value; var a = document.getElementById('fb-wa'); if (a) a.href = waUrl(fbText()); }
});
document.addEventListener('change', function(e){
  var el = e.target; if (!el.dataset) return;
  if (el.dataset.book) ui.book[el.dataset.book] = el.value;
  if (el.dataset.change === 'driver'){ ui.driverId = el.value; render(); focusIn('[data-change="driver"]'); }
  if (el.dataset.change === 'family'){ ui.familyId = el.value; ui.book = freshBook(); render(); focusIn('[data-change="family"]'); }
});

window.__eladio = { parseMessage: parseMessage, state: function(){ return {ui:ui, data:data}; }, assign: function(id, d){ var r = rideById(id); var ok = assign(r, d); ui.fresh = true; render(); return ok; } };
render();
})();
</script>
